<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC699" />
      <stop offset="50%" stop-color="#C5A46D" />
      <stop offset="100%" stop-color="#8E6F38" />
    </linearGradient>
    <linearGradient id="burgundyGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E273A" />
      <stop offset="100%" stop-color="#35141F" />
    </linearGradient>
    <linearGradient id="glassSheenFav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Tile with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#4A1F2D" stroke="url(#goldGradFav)" stroke-width="2"/>
  
  <!-- Architectural Overlapping Glass Panels -->
  <!-- Back Glass Pane -->
  <polygon points="16,14 42,14 36,50 10,50" fill="url(#burgundyGradFav)" stroke="#C5A46D" stroke-width="1.2" opacity="0.85"/>
  <polygon points="16,14 42,14 39,26 13,26" fill="url(#glassSheenFav)"/>

  <!-- Front Glass Pane (Interlocking & Offset) -->
  <polygon points="28,14 54,14 48,50 22,50" fill="none" stroke="url(#goldGradFav)" stroke-width="1.8"/>
  <polygon points="28,14 54,14 51,28 25,28" fill="url(#glassSheenFav)" opacity="0.5"/>

  <!-- AG Architectural Monogram Lines -->
  <!-- 'A' Monogram Left Peak -->
  <path d="M 22,46 L 31,18 L 40,46" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 'A' Crossbar (styled as horizontal glass division) -->
  <line x1="25" y1="36" x2="37" y2="36" stroke="url(#goldGradFav)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 'G' Architectural Loop -->
  <path d="M 46,26 C 46,26 40,21 34,22 C 26,23 23,31 24,38 C 25,44 31,48 39,47 C 45,46 47,40 47,37 L 37,37" fill="none" stroke="url(#goldGradFav)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Light Reflection Sparkle -->
  <circle cx="48" cy="16" r="1.5" fill="#FFFFFF"/>
</svg>
