<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC699" />
      <stop offset="50%" stop-color="#C5A46D" />
      <stop offset="100%" stop-color="#9A7840" />
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E273A" />
      <stop offset="100%" stop-color="#35141F" />
    </linearGradient>
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4A1F2D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Monogram Icon (74x74 box) -->
  <g transform="translate(8, 8)" filter="url(#dropGlow)">
    <!-- Base geometric glass emblem -->
    <rect x="0" y="0" width="74" height="74" rx="14" fill="#4A1F2D" stroke="url(#goldGrad)" stroke-width="1.8" />
    
    <!-- Architectural Pane 1 (Burgundy Tone) -->
    <polygon points="18,14 48,14 41,58 11,58" fill="url(#burgundyGrad)" stroke="#C5A46D" stroke-width="1.2" opacity="0.9" />
    <!-- Glass Sheen Layer -->
    <polygon points="18,14 48,14 45,28 15,28" fill="url(#glassLight)" />

    <!-- Architectural Pane 2 (Champagne Gold Translucent Offset) -->
    <polygon points="32,14 62,14 55,58 25,58" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="32,14 62,14 59,28 29,28" fill="url(#glassLight)" opacity="0.5" />

    <!-- Central A & G Architectural Integration -->
    <!-- 'A' Structure -->
    <path d="M 24,54 L 36,20 L 47,54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 'A' Crossbar -->
    <line x1="28" y1="41" x2="43" y2="41" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" />

    <!-- 'G' Architectural Facet Arc -->
    <path d="M 54,30 C 54,30 47,23 39,24 C 29,25 25,35 27,44 C 28,52 35,57 45,56 C 53,55 55,47 55,44 L 43,44" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Precision Accent Dot -->
    <circle cx="56" cy="18" r="2" fill="#DFC699" />
  </g>

  <!-- Text Group -->
  <!-- Main Brand Name -->
  <g transform="translate(98, 22)">
    <text x="0" y="28" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="30" font-weight="700" letter-spacing="3" fill="#4A1F2D">
      AGARWAL
    </text>
    <text x="178" y="28" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="30" font-weight="600" letter-spacing="3" fill="#C5A46D">
      GLASS
    </text>
    
    <!-- Divider rule -->
    <line x1="2" y1="38" x2="305" y2="38" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.7"/>

    <!-- Tagline -->
    <text x="2" y="52" font-family="'Inter', 'Manrope', sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#92734F">
      REFLECTION OF SATISFACTION
    </text>
  </g>
</svg>
